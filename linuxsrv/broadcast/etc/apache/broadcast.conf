# Trecho para o VirtualHost *:443 do site.
# Modulos: a2enmod proxy proxy_http proxy_wstunnel headers
#
# O Apache termina o TLS e repassa o WebSocket para o bcastd local.
# O IP real do cliente segue em X-Real-IP (o bcastd confia nele com trust_proxy = 1).

<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    <Location /salareuniao/broadcast>
        RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
        ProxyPass        ws://127.0.0.1:8090/salareuniao/broadcast
        ProxyPassReverse ws://127.0.0.1:8090/salareuniao/broadcast
    </Location>
</IfModule>

# /healthz e /metrics do bcastd ficam acessiveis apenas em 127.0.0.1 (nao publique).
